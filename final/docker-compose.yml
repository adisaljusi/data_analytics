version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rolex_postgres
    restart: always
    environment:
      POSTGRES_DB: rolex_db
      POSTGRES_USER: rolex_user
      POSTGRES_PASSWORD: rolex_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolex_user -d rolex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rolex_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rolex.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
